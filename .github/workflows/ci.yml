name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  format:
    name: Code Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Print SDK versions
        run: |
          flutter --version
          dart --version

      - name: Install workspace dependencies
        run: flutter pub get

      - name: Verify code formatting
        run: dart format --output=none --set-exit-if-changed .

  core-minimum:
    name: Core Package (Minimum Dart 3.6.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.0"
          cache: true

      - name: Print SDK versions
        run: |
          dart --version
          flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis (portakal_core)
        working-directory: packages/portakal_core
        run: dart analyze --fatal-infos .

      - name: Run unit tests (portakal_core)
        working-directory: packages/portakal_core
        run: dart test

  core-stable:
    name: Core Package (Dart Stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Print SDK versions
        run: |
          dart --version
          flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis (portakal_core)
        working-directory: packages/portakal_core
        run: dart analyze --fatal-infos .

      - name: Run unit & documentation tests (portakal_core)
        working-directory: packages/portakal_core
        run: dart test

      - name: Verify Dartdoc generation (portakal_core)
        working-directory: packages/portakal_core
        run: dart doc --dry-run .

      - name: API Surface Freeze Guard
        run: |
          dart run tool/generate_api_snapshot.dart
          git diff --exit-code tool/api_surface.txt

      - name: Publish dry-run (portakal_core)
        working-directory: packages/portakal_core
        run: dart pub publish --dry-run

  flutter-minimum:
    name: Flutter Package (Minimum Flutter 3.27.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.0"
          cache: true

      - name: Print SDK versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis (portakal_flutter)
        working-directory: packages/portakal_flutter
        run: flutter analyze --fatal-infos .

      - name: Run widget & acceptance tests (portakal_flutter)
        working-directory: packages/portakal_flutter
        run: flutter test

  flutter-stable:
    name: Flutter Package (Flutter Stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Print SDK versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis (portakal_flutter)
        working-directory: packages/portakal_flutter
        run: flutter analyze --fatal-infos .

      - name: Run widget & acceptance tests (portakal_flutter)
        working-directory: packages/portakal_flutter
        run: flutter test

      - name: Verify Dartdoc generation (portakal_flutter)
        working-directory: packages/portakal_flutter
        run: dart doc --dry-run .

      - name: Publish dry-run (portakal_flutter)
        working-directory: packages/portakal_flutter
        run: flutter pub publish --dry-run

  example-bench-verification:
    name: Example Validation Bench (Flutter Stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis (example)
        working-directory: example
        run: flutter analyze --fatal-infos .

      - name: Run test bench suite (example)
        working-directory: example
        run: flutter test
