version: 0.3.0
homepage: https://github.com/hengmengsroin/portakal_flutter
repository: https://github.com/hengmengsroin/portakal_flutter
issue_tracker: https://github.com/hengmengsroin/portakal_flutter/issues
resolution: workspace

environment:
  sdk: ^3.11.4
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  portakal_core:
    path: ../portakal_core

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
